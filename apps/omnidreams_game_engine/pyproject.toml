[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnidreams-game-engine"
version = "0.1.0"
description = "Reusable interactive game engine for OmniDreams world models"
requires-python = ">=3.10,<3.13"
dependencies = [
    "flashdreams[serving]",
    "flashdreams-omnidreams",
    "ludus-renderer",
    "numpy>=1.24",
    "pillow>=9.0",
    "pyyaml>=6.0",
]

[tool.uv.sources]
flashdreams = { workspace = true }
flashdreams-omnidreams = { workspace = true }
ludus-renderer = { workspace = true }

[tool.setuptools.packages.find]
include = ["omnidreams_game_engine*"]
